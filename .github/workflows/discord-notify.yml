name: Discord Notifications

on:
  pull_request:
    types: [opened, closed]
  workflow_run:
    workflows: ["Frontend CI/CD", "Backend CI/CD"]
    types:
      - completed

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send PR Notification
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "🚀 **Pull Request mới:** ${{ github.event.pull_request.title }} (${{ github.event.pull_request.html_url }}) được tạo bởi **${{ github.actor }}**"

      - name: Send PR Merged Notification
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "✅ **Merge Request thành công:** PR #${{ github.event.pull_request.number }} đã được merge vào nhánh `${{ github.event.pull_request.base.ref }}`!"

      - name: Send CI/CD Status Notification
        if: github.event_name == 'workflow_run'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "${{ github.event.workflow_run.conclusion == 'success' && '🟢 **CI/CD Build Thành Công!**' || '🔴 **CI/CD Build Thất Bại!**' }} [${{ github.event.workflow_run.name }}] cho commit `${{ github.event.workflow_run.head_commit.message }}` bởi ${{ github.event.workflow_run.actor.login }}"
