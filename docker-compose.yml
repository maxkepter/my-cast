services:
  backend:
    image: ghcr.io/maxkepter/my-cast-backend:latest
    build:
      context: ./backend
    ports:
      - "3001:3000"

  frontend:
    image: ghcr.io/maxkepter/my-cast-frontend:latest
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
